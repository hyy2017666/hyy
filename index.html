<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导航主页</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='11' cy='11' r='7' fill='none' stroke='%234f6ef7' stroke-width='2'/%3E%3Cline x1='16.5' y1='16.5' x2='21' y2='21' stroke='%234f6ef7' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f3f5f9;
    --panel:rgba(255,255,255,.78);
    --panel-solid:#ffffff;
    --text:#1f2430;
    --text-dim:#6b7280;
    --border:rgba(0,0,0,.08);
    --accent:#4f6ef7;
    --shadow:0 10px 30px rgba(20,30,60,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    transition:background-color .35s ease, color .35s ease;
    overflow-x:hidden;
  }
  body.has-bg{
    background-size:cover;background-position:center;background-attachment:fixed;
  }
  /* 背景蒙版，保证文字可读 */
  body.has-bg::before{
    content:"";position:fixed;inset:0;z-index:0;
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(2px);
  }

  /* ===== 顶栏 ===== */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:20;
    display:flex;justify-content:flex-end;align-items:center;
    padding:14px 20px;
  }
  .icon-btn{
    width:40px;height:40px;border-radius:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--panel);border:1px solid var(--border);
    cursor:pointer;color:var(--text);
    transition:transform .2s, background .2s;
    backdrop-filter:blur(10px);
  }
  .icon-btn:hover{transform:rotate(45deg);background:var(--panel-solid)}
  .icon-btn svg{width:20px;height:20px}

  /* ===== 主区 ===== */
  .main{
    position:relative;z-index:1;
    max-width:920px;margin:0 auto;
    padding:120px 24px 60px;
  }
  .brand{
    text-align:center;margin-bottom:36px;
  }
  .brand h1{
    font-size:34px;font-weight:700;letter-spacing:2px;
  }
  body.has-bg .brand h1, body.has-bg .brand p{color:#fff}
  .brand p{margin-top:6px;color:var(--text-dim);font-size:14px}
  body.has-bg .brand p{color:rgba(255,255,255,.85)}

  /* ===== 搜索区 ===== */
  .search-wrap{
    display:flex;align-items:stretch;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:0;
    box-shadow:var(--shadow);
    backdrop-filter:blur(14px);
    overflow:visible;
    max-width:720px;margin:0 auto;
  }
  .engine-select{
    position:relative;
  }
  .engine-trigger{
    height:100%;min-width:120px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:0 14px;cursor:pointer;
    border-right:1px solid var(--border);
    font-size:15px;color:var(--text);
    user-select:none;
  }
  .engine-trigger:hover{background:rgba(0,0,0,.03)}
  .engine-trigger .logo{width:20px;height:20px;border-radius:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
  .engine-trigger .caret{margin-left:2px;font-size:10px;color:var(--text-dim);transition:transform .2s}
  .engine-select.open .caret{transform:rotate(180deg)}
  .engine-menu{
    position:absolute;top:calc(100% + 8px);left:0;
    min-width:160px;background:var(--panel-solid);
    border:1px solid var(--border);border-radius:0;
    box-shadow:var(--shadow);padding:6px;
    display:none;z-index:50;
  }
  .engine-select.open .engine-menu{display:block}
  .engine-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 12px;border-radius:0;cursor:pointer;font-size:14px;
  }
  .engine-item:hover{background:rgba(79,110,247,.1)}
  .engine-item .logo{width:20px;height:20px;border-radius:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
  .engine-item.active{color:var(--accent);font-weight:600}

  .search-input{
    flex:1;display:flex;align-items:center;
  }
  .search-input input{
    flex:1;border:none;outline:none;background:transparent;
    padding:0 18px;height:60px;font-size:16px;color:var(--text);
  }
  .search-btn{
    align-self:center;margin:0 8px;
    height:44px;padding:0 22px;border:none;border-radius:0;
    background:var(--accent);color:#fff;font-size:15px;font-weight:600;
    cursor:pointer;transition:opacity .2s, transform .1s;
  }
  .search-btn:hover{opacity:.9}
  .search-btn:active{transform:scale(.97)}

  /* ===== 快捷方式 ===== */
  .section-title{
    margin:48px 0 16px;font-size:14px;color:var(--text-dim);
    letter-spacing:1px;font-weight:600;
  }
  body.has-bg .section-title{color:rgba(255,255,255,.85)}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
    gap:14px;
  }
  .site{
    position:relative;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:16px 8px;border-radius:0;cursor:pointer;
    background:var(--panel);border:1px solid var(--border);
    backdrop-filter:blur(10px);
    transition:transform .18s, box-shadow .18s;
    text-decoration:none;color:var(--text);
  }
  .site:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .site .favicon{
    width:42px;height:42px;border-radius:0;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;font-size:18px;font-weight:700;color:#fff;
  }
  .site .favicon img{width:24px;height:24px;object-fit:contain}
  .site .name{font-size:12.5px;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .site .del{
    position:absolute;top:5px;right:5px;
    width:20px;height:20px;border-radius:0;
    background:rgba(0,0,0,.5);color:#fff;border:none;
    font-size:13px;line-height:1;cursor:pointer;
    display:none;align-items:center;justify-content:center;
  }
  .site:hover .del{display:flex}
  .site.add-site{
    border-style:dashed;background:transparent;
    color:var(--text-dim);
  }
  body.has-bg .site.add-site{color:rgba(255,255,255,.8)}
  .site.add-site .favicon{
    background:rgba(0,0,0,.06);color:var(--text-dim);
  }
  body.has-bg .site.add-site .favicon{background:rgba(255,255,255,.15);color:#fff}
  .site.add-site:hover{transform:translateY(-3px)}

  /* ===== 设置面板 ===== */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90;
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .overlay.show{opacity:1;pointer-events:auto}
  .panel{
    position:fixed;top:0;right:-340px;width:320px;height:100%;
    background:var(--panel-solid);z-index:100;
    box-shadow:-10px 0 30px rgba(0,0,0,.15);
    transition:right .32s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;
  }
  .panel.show{right:0}
  .panel-head{
    padding:20px;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;
  }
  .panel-head h2{font-size:17px;font-weight:700}
  .panel-body{flex:1;overflow-y:auto;padding:20px}
  .group{margin-bottom:26px}
  .group-label{font-size:13px;color:var(--text-dim);margin-bottom:12px;font-weight:600}
  .swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .swatch{
    aspect-ratio:1;border-radius:0;cursor:pointer;
    border:2px solid transparent;position:relative;
    transition:transform .15s;
  }
  .swatch:hover{transform:scale(1.06)}
  .swatch.active{border-color:var(--accent)}
  .swatch.active::after{
    content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.5);font-size:16px;
  }
  .upload-box{
    border:2px dashed var(--border);border-radius:0;
    padding:22px;text-align:center;cursor:pointer;color:var(--text-dim);
    font-size:13px;transition:border-color .2s;
  }
  .upload-box:hover{border-color:var(--accent);color:var(--accent)}
  .upload-box svg{width:28px;height:28px;margin-bottom:8px}
  .hint{font-size:12px;color:var(--text-dim);margin-top:8px;line-height:1.6}
  .reset-btn{
    width:100%;padding:10px;border:1px solid var(--border);
    background:transparent;border-radius:0;cursor:pointer;
    color:var(--text);font-size:13px;
  }
  .reset-btn:hover{background:rgba(0,0,0,.04)}

  /* ===== 添加网站弹窗 ===== */
  .modal{
    position:fixed;inset:0;z-index:110;
    display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.4);padding:20px;
  }
  .modal.show{display:flex}
  .modal-card{
    background:var(--panel-solid);border-radius:0;padding:24px;
    width:100%;max-width:360px;box-shadow:var(--shadow);
  }
  .modal-card h3{font-size:16px;margin-bottom:16px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px}
  .field input{
    width:100%;padding:10px 12px;border:1px solid var(--border);
    border-radius:0;font-size:14px;outline:none;
  }
  .field input:focus{border-color:var(--accent)}
  .modal-actions{display:flex;gap:10px;margin-top:18px}
  .modal-actions button{
    flex:1;padding:10px;border-radius:0;border:none;cursor:pointer;font-size:14px;font-weight:600;
  }
  .btn-cancel{background:rgba(0,0,0,.06);color:var(--text)}
  .btn-ok{background:var(--accent);color:#fff}

  /* toast */
  .toast{
    position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
    background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:0;
    font-size:13px;opacity:0;pointer-events:none;transition:all .3s;z-index:200;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:640px){
    .main{padding-top:100px}
    .brand h1{font-size:26px}
    .search-wrap{flex-wrap:nowrap;border-radius:0}
    .engine-trigger{min-width:0;padding:0 10px;gap:6px;white-space:nowrap}
    .engine-trigger .caret{display:none}
    .search-input input{padding:0 10px;font-size:15px}
    .search-btn{margin:0 6px 0 0;height:46px;padding:0 14px;font-size:14px;flex-shrink:0}
    .engine-menu{position:fixed;top:auto;bottom:20px;left:10px;right:10px;width:auto}
    .grid{grid-template-columns:repeat(auto-fill,minmax(86px,1fr))}
  }
</style>
</head>
<body>

<!-- 顶栏设置按钮 -->
<div class="topbar">
  <button class="icon-btn" id="settingsBtn" title="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
</div>

<!-- 主区 -->
<div class="main">
  <div class="brand">
    <h1>导航主页</h1>
    <p>高效开始每一天</p>
  </div>

  <div class="search-wrap">
    <div class="engine-select" id="engineSelect">
      <div class="engine-trigger" id="engineTrigger">
        <span class="logo" id="engineLogo" style="background:#306EFF">百</span>
        <span id="engineName">百度</span>
        <span class="caret">▼</span>
      </div>
      <div class="engine-menu" id="engineMenu"></div>
    </div>
    <div class="search-input">
      <input type="text" id="searchInput" placeholder="输入关键词，回车搜索..." autofocus>
    </div>
    <button class="search-btn" id="searchBtn">搜索</button>
  </div>

  <div class="section-title">常用网站</div>
  <div class="grid" id="siteGrid"></div>
</div>

<!-- 设置遮罩 + 面板 -->
<div class="overlay" id="overlay"></div>
<aside class="panel" id="panel">
  <div class="panel-head">
    <h2>外观设置</h2>
    <button class="icon-btn" id="closePanel" style="width:32px;height:32px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="panel-body">
    <div class="group">
      <div class="group-label">纯色主题</div>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="group">
      <div class="group-label">自定义背景图</div>
      <div class="upload-box" id="uploadBox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <div>点击上传背景图片</div>
      </div>
      <input type="file" id="bgInput" accept="image/*" hidden>
      <div class="hint">图片将保存在浏览器本地（localStorage），仅自己可见。</div>
    </div>
    <div class="group">
      <button class="reset-btn" id="resetAll">恢复默认主题与网站</button>
    </div>
  </div>
</aside>

<!-- 添加网站弹窗 -->
<div class="modal" id="siteModal">
  <div class="modal-card">
    <h3>添加常用网站</h3>
    <div class="field">
      <label>网站名称</label>
      <input type="text" id="siteName" placeholder="例如：知乎">
    </div>
    <div class="field">
      <label>网址（https://...）</label>
      <input type="text" id="siteUrl" placeholder="例如：https://www.zhihu.com">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelAdd">取消</button>
      <button class="btn-ok" id="confirmAdd">添加</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  // ====== 搜索引擎 / AI 入口配置 ======
  const ENGINES = [
    { group:'搜索引擎' },
    { id:'baidu', name:'百度', logo:'百', color:'#306EFF', url:'https://www.baidu.com/s?wd=', ask:true },
    { id:'bing',  name:'必应', logo:'B', color:'#00897B', url:'https://www.bing.com/search?q=', ask:true },
    { id:'google',name:'谷歌', logo:'G', color:'#DB4437', url:'https://www.google.com/search?q=', ask:true },
    { id:'so360', name:'360搜索', logo:'3', color:'#2196F3', url:'https://www.so.com/s?q=', ask:true },
    { group:'AI 问答' },
    { id:'doubao', name:'豆包', logo:'豆', color:'#325AB4', url:'https://www.doubao.com/chat/', ask:false },
    { id:'wenxin', name:'文心一言', logo:'文', color:'#2932E1', url:'https://yiyan.baidu.com/', ask:false },
    { id:'tongyi', name:'通义千问', logo:'通', color:'#615CED', url:'https://www.tongyi.com/', ask:false },
    { id:'kimi',   name:'Kimi',  logo:'K', color:'#1F1F1F', url:'https://kimi.moonshot.cn/', ask:false },
  ];

  // ====== 预制纯色主题 ======
  const THEMES = [
    { name:'云白', bg:'#f3f5f9', dark:false },
    { name:'墨黑', bg:'#1c1f26', dark:true },
    { name:'深蓝', bg:'#1e3a5f', dark:true },
    { name:'墨绿', bg:'#20433b', dark:true },
    { name:'酒红', bg:'#5b2a3a', dark:true },
    { name:'暖棕', bg:'#6b4a35', dark:true },
    { name:'淡紫', bg:'#ede7f6', dark:false },
    { name:'浅青', bg:'#e0f2f1', dark:false },
  ];

  const DEFAULT_SITES = [
    { name:'B站',   url:'https://www.bilibili.com' },
    { name:'知乎',  url:'https://www.zhihu.com' },
    { name:'微博',  url:'https://weibo.com' },
    { name:'豆瓣',  url:'https://www.douban.com' },
    { name:'淘宝',  url:'https://www.taobao.com' },
    { name:'京东',  url:'https://www.jd.com' },
    { name:'GitHub',url:'https://github.com' },
    { name:'百度',  url:'https://www.baidu.com' },
  ];

  // ====== 状态 ======
  const state = {
    engine: 'baidu',
    sites: DEFAULT_SITES.slice(),
    themeIdx: 0,
    bgImage: null,
  };

  // ====== 读取本地存储 ======
  function load(){
    try{
      const s = localStorage.getItem('navHome.state');
      if(s){
        const o = JSON.parse(s);
        if(o.engine) state.engine = o.engine;
        if(Array.isArray(o.sites)) state.sites = o.sites;
        if(typeof o.themeIdx === 'number') state.themeIdx = o.themeIdx;
        if(o.bgImage) state.bgImage = o.bgImage;
      }
    }catch(e){}
  }
  function save(){
    try{ localStorage.setItem('navHome.state', JSON.stringify(state)); }catch(e){
      toast('存储空间不足，背景图可能无法保存');
    }
  }

  // ====== 渲染搜索引擎下拉 ======
  function renderEngineMenu(){
    const menu = document.getElementById('engineMenu');
    menu.innerHTML = '';
    ENGINES.forEach(e=>{
      if(e.group){
        const g = document.createElement('div');
        g.style.cssText = 'padding:8px 12px 4px;font-size:11px;color:var(--text-dim);letter-spacing:1px';
        g.textContent = e.group;
        menu.appendChild(g);
        return;
      }
      const div = document.createElement('div');
      div.className = 'engine-item' + (e.id===state.engine?' active':'');
      div.innerHTML = `<span class="logo" style="background:${e.color}">${e.logo}</span><span>${e.name}</span>`;
      div.onclick = (ev)=>{ ev.stopPropagation(); state.engine = e.id; save(); renderEngineTrigger(); renderEngineMenu(); closeEngineMenu(); };
      menu.appendChild(div);
    });
  }
  function renderEngineTrigger(){
    const e = ENGINES.find(x=>x.id===state.engine) || ENGINES[0];
    const logo = document.getElementById('engineLogo');
    logo.style.background = e.color;
    logo.textContent = e.logo;
    document.getElementById('engineName').textContent = e.name;
  }
  function openEngineMenu(){ document.getElementById('engineSelect').classList.add('open'); }
  function closeEngineMenu(){ document.getElementById('engineSelect').classList.remove('open'); }

  // ====== 执行搜索 ======
  function doSearch(){
    const q = document.getElementById('searchInput').value.trim();
    const e = ENGINES.find(x=>x.id===state.engine) || ENGINES[0];
    if(e.ask){
      if(!q){ toast('输入要搜的内容'); return; }
      window.open(e.url + encodeURIComponent(q), '_blank');
    } else {
      // AI 入口：把问题复制到剪贴板，再打开对应 AI 主页
      if(q && navigator.clipboard){
        导航器。剪贴板。写文本( q )。捕获( ( ) => { } ) ;
      }
      窗户。open ( e.url , '_ blank ' ) ;
      toast ( q ? `已打开${ e .name } ，问题已复制，粘贴即可` : `已打开${ e .name } ` ) ;
    }
  }

  // ====== 渲染网站网格 ======
  函数 渲染站点（）{
    常量 网格=文档. getElementById ( 'siteGrid' ) ;
    网格。内部 HTML = '' ;
    状态。网站。forEach ( (站点, idx ) => {
      常量 a =文档.创建元素( 'a' ) ;
      一个。类名= '站点' ;
      一个。href =站点.网址；
      一个。目标= '_blank' ;
      一个。rel = 'noopener' ;
      const  domain = ( ( ) => {  try {  return  new  URL ( site . url ) . hostname . Replace ( /^www\./ , '' ) ; } catch ( e ) {  return  site . url ; }  } ) ( ) ;
      const  letter = (站点.名称||域.charAt ( 0 ) || '# ' )。字符( 0 )。到大写（）；
      一个。内部HTML = `
        <span class="favicon" style="background:${hueFrom(domain)}">
          <img src="https://www.google.com/s2/favicons?domain=${domain}&sz=64"
               onerror="this.style.display='none';this.parentNode.textContent='${letter}'">
        </span>
        <span class="name">${escapeHtml(site.name)}</span>
        <button class="del" title="删除">×</button>
      `;
      a.querySelector('.del').onclick = (ev)=>{
        ev.preventDefault(); ev.stopPropagation();
        if(confirm(`删除「${site.name}」？`)){
          state.sites.splice(idx,1); save(); renderSites();
        }
      };
      grid.appendChild(a);
    });

    // 添加按钮
    const add = document.createElement('div');
    add.className = 'site add-site';
    add.innerHTML = `<span class="favicon">+</span><span class="name">添加网站</span>`;
    add.onclick = ()=>{
      document.getElementById('siteName').value = '';
      document.getElementById('siteUrl').value = '';
      document.getElementById('siteModal').classList.add('show');
      setTimeout(()=>document.getElementById('siteName').focus(), 50);
    };
    grid.appendChild(add);
  }

  function hueFrom(str){
    let h = 0;
    for(let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) % 360;
    return `hsl(${h}, 55%, 55%)`;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ====== 主题 ======
  function renderSwatches(){
    const box = document.getElementById('swatches');
    box.innerHTML = '';
    THEMES.forEach((t,i)=>{
      const d = document.createElement('div');
      d.className = 'swatch' + (i===state.themeIdx?' active':'');
      d.style.background = t.bg;
      d.title = t.name;
      d.onclick = ()=>{
        state.themeIdx = i;
        state.bgImage = null;   // 选纯色时清掉自定义背景
        save(); applyTheme(); renderSwatches();
      };
      box.appendChild(d);
    });
  }
  function applyTheme(){
    const t = THEMES[state.themeIdx] || THEMES[0];
    const root = document.documentElement.style;
    if(state.bgImage){
      body.classList.add('has-bg');
      body.style.backgroundImage = `url("${state.bgImage}")`;
      root.setProperty('--text', '#fff');
      root.setProperty('--text-dim', 'rgba(255,255,255,.85)');
      root.setProperty('--panel', 'rgba(30,30,40,.55)');
      root.setProperty('--panel-solid', 'rgba(35,35,45,.92)');
      root.setProperty('--border', 'rgba(255,255,255,.15)');
      root.setProperty('--shadow', '0 10px 30px rgba(0,0,0,.35)');
    } else {
      body.classList.remove('has-bg');
      body.style.backgroundImage = '';
      if(t.dark){
        root.setProperty('--bg', t.bg);
        root.setProperty('--text', '#f0f2f7');
        root.setProperty('--text-dim', '#9aa3b2');
        root.setProperty('--panel', 'rgba(40,44,54,.7)');
        root.setProperty('--panel-solid', '#23272f');
        root.setProperty('--border', 'rgba(255,255,255,.1)');
        root.setProperty('--shadow', '0 10px 30px rgba(0,0,0,.35)');
      } else {
        root.setProperty('--bg', t.bg);
        root.setProperty('--text', '#1f2430');
        root.setProperty('--text-dim', '#6b7280');
        root.setProperty('--panel', 'rgba(255,255,255,.78)');
        root.setProperty('--panel-solid', '#ffffff');
        root.setProperty('--border', 'rgba(0,0,0,.08)');
        root.setProperty('--shadow', '0 10px 30px rgba(20,30,60,.10)');
      }
    }
  }

  // ====== 上传背景 ======
  function setupUpload(){
    const box = document.getElementById('uploadBox');
    const input = document.getElementById('bgInput');
    box.onclick = ()=>input.click();
    input.onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      if(file.size > 2.5*1024*1024){
        toast('图片过大（>2.5MB），请压缩后再试'); return;
      }
      const reader = new FileReader();
      reader.onload = (ev)=>{
        state.bgImage = ev.target.result;
        save(); applyTheme();
        toast('背景已设置');
      };
      reader.readAsDataURL(file);
    };
  }

  // ====== toast ======
  let toastTimer;
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
  }

  // ====== 事件绑定 ======
  const body = document.body;
  function bind(){
    document.getElementById('engineTrigger').onclick = (e)=>{
      e.stopPropagation();
      const sel = document.getElementById('engineSelect');
      sel.classList.contains('open') ? closeEngineMenu() : openEngineMenu();
    };
    document.addEventListener('click', closeEngineMenu);

    document.getElementById('searchBtn').onclick = doSearch;
    document.getElementById('searchInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });

    document.getElementById('settingsBtn').onclick = ()=>{
      document.getElementById('panel').classList.add('show');
      document.getElementById('overlay').classList.add('show');
    };
    document.getElementById('closePanel').onclick = closePanel;
    document.getElementById('overlay').onclick = closePanel;

    document.getElementById('cancelAdd').onclick = ()=>document.getElementById('siteModal').classList.remove('show');
    document.getElementById('confirmAdd').onclick = ()=>{
      const name = document.getElementById('siteName').value.trim();
      let url = document.getElementById('siteUrl').value.trim();
      if(!name || !url){ toast('请填写名称和网址'); return; }
      if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
      state.sites.push({ name, url });
      save(); renderSites();
      document.getElementById('siteModal').classList.remove('show');
      toast('已添加');
    };
    document.getElementById('siteModal').addEventListener('click', e=>{
      if(e.target.id==='siteModal') e.target.classList.remove('show');
    });

    document.getElementById('resetAll').onclick = ()=>{
      if(confirm('恢复默认主题、搜索引擎和网站列表？（自定义背景也会清除）')){
        state.engine = 'baidu';
        state.sites = DEFAULT_SITES.slice();
        state.themeIdx = 0;
        state.bgImage = null;
        save();
        renderEngineTrigger(); renderEngineMenu(); renderSites(); renderSwatches(); applyTheme();
        toast('已恢复默认');
      }
    };

    setupUpload();
  }
  function closePanel(){
    document.getElementById('panel').classList.remove('show');
    document.getElementById('overlay').classList.remove('show');
  }

  // ====== 启动 ======
  load();
  renderEngineTrigger();
  renderEngineMenu();
  renderSites();
  renderSwatches();
  applyTheme();
  bind();
})();
</script>
